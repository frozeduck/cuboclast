name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version (e.g. v0.5.0)'
        required: true
        default: 'v0.5.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web application & PWA assets
        run: npm run build

      - name: Create release archive
        run: |
          cd dist
          zip -r ../cuboclast-build.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: CuboClast ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: false
          body: |
            ## 🎮 CuboClast Release

            ### 🌟 Caratteristiche Principali
            - **Roguelike Peggle & Cube Breaker**: Fisica dinamica con traiettorie a doppio rimbalzo laser, cannone cyberpunk e cestello magnetico.
            - **7 Archetipi Core**: Volt Overcharge, Pyro Detonator, Swarm Matrix, Kinetic Titan, Crystal Singularity, Quantum Singularity e Chrono Pulse.
            - **5 Nuove Combo Fusione Doppia**: Sovraccarico Plasma, Scarica Magnetica, Sciame Detonante, Iper-Sciame Perforante e Superconduzione Criogenica.
            - **Boss Fight a 3 Fasi**: Con satelliti difensivi, impulsi EMP repulsivi e discesa enrage.
            - **PWA & WebAPK Standalone**: Installabile su Android a schermo intero offline a 60/120 FPS.
          files: |
            cuboclast-build.zip
            public/cuboclast-icon.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
